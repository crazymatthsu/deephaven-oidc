# OPTIONAL — only if the pub-sub daemon runs in-cluster. The Deephaven SERVER needs no secrets
# at all in the direct-Entra architecture (tenant/client ids and scopes are public identifiers).
#
# Copy to 40-pubsub-secret.yaml (gitignored pattern), fill in, and reference from your daemon
# Deployment via envFrom.secretRef. Better still on EKS: store the client secret in AWS Secrets
# Manager and mount it with External Secrets Operator or the Secrets Store CSI driver instead of
# a raw Kubernetes Secret. One confidential app (and one secret) per team/workload — see
# docs/oidc/entra-tenant-setup-guide.md §6.6.
apiVersion: v1
kind: Secret
metadata:
  name: deephaven-pubsub-entra
  namespace: deephaven-entra
type: Opaque
stringData:
  AUTH_PROVIDER: entra
  ENTRA_TENANT_ID: REPLACE-tenant-guid
  ENTRA_CLIENT_ID: REPLACE-pubsub-app-client-guid
  ENTRA_CLIENT_SECRET: REPLACE-client-secret-value
  ENTRA_SCOPE: api://REPLACE-api-app-client-guid/.default
  DH_HOST: deephaven.deephaven-entra.svc.cluster.local
  DH_PORT: "10000"
