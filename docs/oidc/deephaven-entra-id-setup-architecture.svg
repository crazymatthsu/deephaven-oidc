<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1380" viewBox="0 0 1680 1380">
  <rect width="1680" height="1380" fill="#FFFFFF"/>

  <text x="840" y="32" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#232F3E">Deephaven + Microsoft Entra ID Architecture</text>
  <text x="840" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#545B64">Daemon client credentials · User SSO + Microsoft Authenticator (UI) · JWT validation on Deephaven</text>

  <!-- LEFT clients -->
  <rect x="30" y="80" width="300" height="520" fill="#F7F9FC" stroke="#D5DBDB"/>
  <text x="45" y="105" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#232F3E">Clients</text>

  <rect x="50" y="120" width="260" height="75" rx="8" fill="#FFFFFF" stroke="#1B74C4" stroke-width="2"/>
  <text x="180" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#232F3E">OrderSimulator</text>
  <text x="180" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">Daemon / service account</text>
  <text x="180" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">MSAL client credentials</text>

  <rect x="50" y="210" width="260" height="90" rx="8" fill="#FFFFFF" stroke="#1B74C4" stroke-width="2"/>
  <text x="180" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#232F3E">Deephaven Web UI (browser)</text>
  <text x="180" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">User-facing login</text>
  <text x="180" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">MSAL.js / OIDC auth code + PKCE</text>
  <text x="180" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#0B5CAB">Enterprise SSO + Authenticator MFA</text>

  <rect x="50" y="315" width="260" height="75" rx="8" fill="#FFFFFF" stroke="#1B74C4" stroke-width="2"/>
  <text x="180" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#232F3E">OrderSubscriber (CLI)</text>
  <text x="180" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">Optional interactive user</text>
  <text x="180" y="377" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">Device code (SSO + MFA capable)</text>

  <rect x="50" y="410" width="260" height="160" rx="8" fill="#E8F4FD" stroke="#1B74C4"/>
  <text x="65" y="435" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#232F3E">Auth modes</text>
  <text x="65" y="458" font-family="Arial,sans-serif" font-size="10" fill="#333">Daemon: AUTH_PROVIDER=entra</text>
  <text x="65" y="476" font-family="Arial,sans-serif" font-size="10" fill="#333">  ENTRA_CLIENT_ID + secret/cert</text>
  <text x="65" y="494" font-family="Arial,sans-serif" font-size="10" fill="#333">  scope = api://.../.default</text>
  <text x="65" y="518" font-family="Arial,sans-serif" font-size="10" fill="#333">UI: public client + redirect URI</text>
  <text x="65" y="536" font-family="Arial,sans-serif" font-size="10" fill="#333">  scope = api://.../access_as_user</text>
  <text x="65" y="554" font-family="Arial,sans-serif" font-size="10" fill="#333">  + openid profile offline_access</text>

  <!-- CENTER Entra -->
  <rect x="360" y="80" width="560" height="700" fill="#FFF5F5" stroke="#C23934" stroke-width="2"/>
  <text x="380" y="108" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#232F3E">Microsoft Entra ID (cloud tenant)</text>

  <rect x="380" y="125" width="520" height="130" rx="8" fill="#FFFFFF" stroke="#C23934" stroke-width="2"/>
  <text x="395" y="150" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#C23934">App: deephaven-api (resource / audience)</text>
  <text x="395" y="175" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">Application ID URI = api://API-CLIENT-ID</text>
  <text x="395" y="195" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">App role: Deephaven.Access (Applications)</text>
  <text x="395" y="215" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">Delegated scope for users (optional): access_as_user</text>
  <text x="395" y="235" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">Token aud claimed by Deephaven handler</text>

  <rect x="380" y="270" width="520" height="120" rx="8" fill="#FFFFFF" stroke="#D79B00" stroke-width="2"/>
  <text x="395" y="295" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#8A5A00">App: deephaven-order-simulator (confidential)</text>
  <text x="395" y="320" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">Client secret or certificate</text>
  <text x="395" y="340" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">Application permission: Deephaven.Access</text>
  <text x="395" y="360" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">Admin consent · public client flows = No</text>

  <rect x="380" y="410" width="520" height="145" rx="8" fill="#FFFFFF" stroke="#0B5CAB" stroke-width="2"/>
  <text x="395" y="435" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#0B5CAB">App: deephaven-web-ui (public client for SSO)</text>
  <text x="395" y="460" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">Redirect URI = https://deephaven-host/ (or IDE callback)</text>
  <text x="395" y="480" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">Allow public client flows = Yes (if device code also used)</text>
  <text x="395" y="500" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">Delegated permission on deephaven-api</text>
  <text x="395" y="520" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">SPA / auth code + PKCE (MSAL.js)</text>
  <text x="395" y="540" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">No client secret (browser public client)</text>

  <rect x="380" y="575" width="520" height="100" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="395" y="600" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1B5E20">Enterprise SSO + Microsoft Authenticator</text>
  <text x="395" y="625" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">Entra hosted login page · Conditional Access · MFA push / number match</text>
  <text x="395" y="645" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">SSO cookie across Microsoft apps · no password in Deephaven UI</text>
  <text x="395" y="665" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">Applies to Web UI and device-code CLI — NOT to client credentials</text>

  <rect x="420" y="695" width="440" height="55" rx="8" fill="#F8CECC" stroke="#C23934"/>
  <text x="640" y="718" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#232F3E">Token endpoint  POST .../{tenant}/oauth2/v2.0/token</text>
  <text x="640" y="738" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">App-only: .default   |   User: access_as_user + OIDC scopes</text>

  <!-- RIGHT Deephaven -->
  <rect x="950" y="80" width="360" height="420" fill="#E8F4FD" stroke="#1B74C4" stroke-width="2"/>
  <text x="965" y="108" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#0B5CAB">Deephaven Community Core</text>

  <rect x="970" y="125" width="320" height="100" rx="8" fill="#FFFFFF" stroke="#1B74C4" stroke-width="2"/>
  <text x="1130" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#232F3E">EntraOidcAuthenticationHandler</text>
  <text x="1130" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">Spring NimbusJwtDecoder + JWKS</text>
  <text x="1130" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">Validate iss, exp, signature, aud</text>
  <text x="1130" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#333">Same handler for daemon + UI tokens</text>

  <rect x="970" y="245" width="320" height="120" rx="8" fill="#FFFFFF" stroke="#1B74C4" stroke-width="2"/>
  <text x="985" y="270" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#232F3E">Server config</text>
  <text x="985" y="292" font-family="Arial,sans-serif" font-size="10" fill="#333">AuthHandlers = EntraOidc...</text>
  <text x="985" y="310" font-family="Arial,sans-serif" font-size="10" fill="#333">issuer-uri = login.microsoftonline.com</text>
  <text x="985" y="328" font-family="Arial,sans-serif" font-size="10" fill="#333">  /{tenant}/v2.0</text>
  <text x="985" y="350" font-family="Arial,sans-serif" font-size="10" fill="#333">audience = api://API-CLIENT-ID</text>

  <text x="970" y="400" font-family="Arial,sans-serif" font-size="11" font-style="italic" fill="#0B5CAB">Deephaven does not host login UI.</text>
  <text x="970" y="418" font-family="Arial,sans-serif" font-size="11" font-style="italic" fill="#0B5CAB">Browser redirects to Entra; token</text>
  <text x="970" y="436" font-family="Arial,sans-serif" font-size="11" font-style="italic" fill="#0B5CAB">is presented back to Deephaven.</text>

  <!-- User SSO flow panel -->
  <rect x="950" y="520" width="360" height="260" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="965" y="545" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1B5E20">UI user login flow (SSO + MFA)</text>
  <text x="965" y="575" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">1. User opens Deephaven Web IDE</text>
  <text x="965" y="595" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">2. MSAL.js redirects to Entra login</text>
  <text x="965" y="615" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">3. Enterprise SSO (existing session)</text>
  <text x="965" y="635" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">   or password + Microsoft Authenticator</text>
  <text x="965" y="655" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">4. Auth code returned to browser (PKCE)</text>
  <text x="965" y="675" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">5. MSAL.js exchanges code for tokens</text>
  <text x="965" y="695" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">6. Access token sent to Deephaven</text>
  <text x="965" y="715" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">7. Handler validates JWT, session starts</text>
  <text x="965" y="740" font-family="Arial,sans-serif" font-size="10" fill="#545B64">Requires custom Entra JS login plugin</text>
  <text x="965" y="756" font-family="Arial,sans-serif" font-size="10" fill="#545B64">(or Keycloak broker until plugin exists)</text>

  <!-- Daemon flow -->
  <rect x="30" y="620" width="300" height="160" fill="#FFF8E1" stroke="#D79B00"/>
  <text x="45" y="645" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#8A5A00">Daemon flow (no SSO)</text>
  <text x="45" y="670" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">1. Client credentials to Entra</text>
  <text x="45" y="690" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">2. App-only access token</text>
  <text x="45" y="710" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">3. Token to Deephaven handler</text>
  <text x="45" y="730" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">4. Publish / subscribe tables</text>
  <text x="45" y="755" font-family="Arial,sans-serif" font-size="10" fill="#545B64">No user · No Authenticator</text>

  <!-- Checklist -->
  <rect x="30" y="810" width="1280" height="220" fill="#F7F9FC" stroke="#D5DBDB"/>
  <text x="45" y="838" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#232F3E">Setup checklist</text>
  <text x="45" y="865" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">Daemon path: deephaven-api + deephaven-order-simulator · app role · admin consent · client credentials · audience match</text>
  <text x="45" y="890" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">UI SSO path: register deephaven-web-ui (public/SPA) · redirect URI · delegated API permission · admin consent</text>
  <text x="45" y="915" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">Conditional Access / MFA: require Microsoft Authenticator in Entra for user sign-in (does not apply to client credentials)</text>
  <text x="45" y="940" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">Web IDE: MSAL.js auth code + PKCE plugin hands access token to Deephaven (or temporary Keycloak broker to Entra)</text>
  <text x="45" y="965" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">CLI interactive: prefer device code over ROPC so SSO + Authenticator work</text>
  <text x="45" y="990" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">Verify tokens at jwt.ms (iss, aud, appid/roles or scp) · align Deephaven issuer-uri and audience</text>
  <text x="45" y="1015" font-family="Arial,sans-serif" font-size="11" fill="#232F3E">Docs: entra-id-app-registration-setup.md · custom-entra-oidc-handler-with-msal.md</text>

  <!-- arrows (simple) -->
  <line x1="310" y1="160" x2="420" y2="720" stroke="#C23934" stroke-width="2"/>
  <text x="320" y="400" font-family="Arial,sans-serif" font-size="10" fill="#C23934">daemon token</text>

  <line x1="310" y1="255" x2="380" y2="480" stroke="#2E7D32" stroke-width="2"/>
  <text x="315" y="360" font-family="Arial,sans-serif" font-size="10" fill="#1B5E20">UI redirect / SSO</text>

  <line x1="310" y1="160" x2="970" y2="175" stroke="#1B74C4" stroke-width="2"/>
  <text x="600" y="145" font-family="Arial,sans-serif" font-size="10" fill="#1B74C4">Bearer token to Deephaven</text>

  <text x="840" y="1360" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#879596">docs/oidc/deephaven-entra-id-setup-architecture.svg · includes UI SSO + Microsoft Authenticator · 2026-07-27</text>
</svg>
