<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <rect width="1600" height="1050" fill="#FFFFFF"/>
  <text x="800" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a">Keycloak as OIDC Broker to Microsoft Entra ID (EKS)</text>

  <!-- Clients -->
  <rect x="40" y="80" width="260" height="440" rx="12" fill="#F8F9FA" stroke="#6C757D" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="170" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#333">Clients / Users</text>
  <rect x="70" y="140" width="200" height="70" rx="10" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2"/>
  <text x="170" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Browser</text>
  <text x="170" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">(Web IDE)</text>
  <rect x="70" y="250" width="200" height="70" rx="10" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2"/>
  <text x="170" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold">OrderSubscriber</text>
  <text x="170" y="298" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">(Barrage client)</text>
  <rect x="70" y="360" width="200" height="70" rx="10" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2"/>
  <text x="170" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold">OrderSimulator</text>
  <text x="170" y="408" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">(service account)</text>

  <!-- EKS -->
  <rect x="340" y="80" width="640" height="680" rx="12" fill="#FFF8E7" stroke="#D6B656" stroke-width="2"/>
  <text x="660" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#333">AWS EKS Cluster  ·  namespace: deephaven</text>
  <rect x="420" y="130" width="480" height="70" rx="10" fill="#FFE6CC" stroke="#D79B00" stroke-width="2"/>
  <text x="660" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Application Load Balancer (ALB) + Ingress</text>
  <text x="660" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">TLS termination (ACM)</text>

  <!-- Keycloak -->
  <rect x="380" y="230" width="560" height="200" rx="10" fill="#F3E8FF" stroke="#9673A6" stroke-width="2"/>
  <text x="660" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#5B3A6E">Keycloak (OIDC Broker)</text>
  <rect x="410" y="275" width="190" height="85" rx="8" fill="#D5E8D4" stroke="#82B366" stroke-width="2"/>
  <text x="505" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">Keycloak Pods</text>
  <text x="505" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">(replicas: 2–3)</text>
  <text x="505" y="336" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">jdbc-ping + shared RDS</text>
  <rect x="630" y="275" width="280" height="125" rx="8" fill="#F8CECC" stroke="#B85450" stroke-width="2"/>
  <text x="645" y="298" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Realm: deephaven_core</text>
  <text x="645" y="320" font-family="Arial,sans-serif" font-size="10">• Clients (deephaven, order-simulator)</text>
  <text x="645" y="340" font-family="Arial,sans-serif" font-size="10">• Roles (trader-us, trader-emea…)</text>
  <text x="645" y="360" font-family="Arial,sans-serif" font-size="10">• Identity Provider: Entra ID</text>
  <text x="645" y="385" font-family="Arial,sans-serif" font-size="9" fill="#666">Issues its own tokens after successful Entra federation</text>

  <!-- Deephaven -->
  <rect x="380" y="460" width="560" height="260" rx="10" fill="#E8F0FE" stroke="#6C8EBF" stroke-width="2"/>
  <text x="660" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#2C5AA0">Deephaven Community Core</text>
  <rect x="410" y="510" width="210" height="130" rx="8" fill="#D5E8D4" stroke="#82B366" stroke-width="2"/>
  <text x="515" y="540" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">Deephaven Pods</text>
  <text x="515" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">(replicas: 1–3)</text>
  <text x="515" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">OIDC handler validates</text>
  <text x="515" y="608" text-anchor="middle" font-family="Arial,sans-serif" font-size="10">Keycloak tokens only</text>
  <rect x="650" y="510" width="260" height="170" rx="8" fill="#FFF2CC" stroke="#D6B656" stroke-width="2"/>
  <text x="665" y="535" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Config:</text>
  <text x="665" y="565" font-family="Arial,sans-serif" font-size="10">authentication.oidc.keycloak.url</text>
  <text x="665" y="585" font-family="Arial,sans-serif" font-size="10">  = https://auth…</text>
  <text x="665" y="620" font-family="Arial,sans-serif" font-size="10">AuthHandlers =</text>
  <text x="665" y="640" font-family="Arial,sans-serif" font-size="10">  OidcAuthenticationHandler</text>

  <!-- Entra -->
  <rect x="1020" y="80" width="520" height="340" rx="12" fill="#F8F9FA" stroke="#6C757D" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1280" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#333">Microsoft Entra ID</text>
  <rect x="1080" y="140" width="400" height="70" rx="10" fill="#F8CECC" stroke="#B85450" stroke-width="2"/>
  <text x="1280" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Entra Tenant</text>
  <text x="1280" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">(Azure AD)</text>
  <rect x="1080" y="240" width="400" height="60" rx="10" fill="#FFE6CC" stroke="#D79B00" stroke-width="2"/>
  <text x="1280" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold">App Registration</text>
  <text x="1280" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="11">(OIDC / OAuth2)</text>
  <rect x="1080" y="330" width="400" height="60" rx="10" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2"/>
  <text x="1280" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Users / Groups / App Roles</text>

  <!-- Notes -->
  <rect x="1020" y="450" width="520" height="310" rx="12" fill="#F8F9FA" stroke="#6C757D" stroke-width="2"/>
  <text x="1040" y="480" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#333">Flow summary</text>
  <text x="1040" y="510" font-family="Arial,sans-serif" font-size="10">1. User opens Deephaven IDE</text>
  <text x="1040" y="530" font-family="Arial,sans-serif" font-size="10">2. Keycloak redirects to Entra ID (OIDC federation)</text>
  <text x="1040" y="550" font-family="Arial,sans-serif" font-size="10">3. User authenticates at Entra; claims returned to Keycloak</text>
  <text x="1040" y="570" font-family="Arial,sans-serif" font-size="10">4. Keycloak issues its own access token</text>
  <text x="1040" y="588" font-family="Arial,sans-serif" font-size="10">   (with mapped realm roles)</text>
  <text x="1040" y="610" font-family="Arial,sans-serif" font-size="10">5. Client presents Keycloak token to Deephaven</text>
  <text x="1040" y="630" font-family="Arial,sans-serif" font-size="10">6. Deephaven validates token against Keycloak only</text>
  <text x="1040" y="648" font-family="Arial,sans-serif" font-size="10">   (issuer + JWKS)</text>
  <text x="1040" y="690" font-family="Arial,sans-serif" font-size="10" fill="#B85450">Key point: Deephaven never talks to Entra ID</text>
  <text x="1040" y="708" font-family="Arial,sans-serif" font-size="10" fill="#B85450">directly. Keycloak is the single IdP it trusts.</text>

  <!-- Flow lines -->
  <line x1="270" y1="175" x2="420" y2="165" stroke="#6C8EBF" stroke-width="2"/>
  <text x="300" y="155" font-family="Arial,sans-serif" font-size="9" fill="#6C8EBF">1. Open IDE</text>
  <line x1="910" y1="310" x2="1080" y2="175" stroke="#B85450" stroke-width="2"/>
  <text x="960" y="230" font-family="Arial,sans-serif" font-size="9" fill="#B85450">2. Federate / redirect</text>
  <line x1="1080" y1="200" x2="910" y2="340" stroke="#B85450" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="960" y="370" font-family="Arial,sans-serif" font-size="9" fill="#B85450">3. Auth success + claims</text>
  <text x="310" y="290" font-family="Arial,sans-serif" font-size="9" fill="#9673A6">4. Keycloak access token</text>
  <line x1="270" y1="210" x2="410" y2="560" stroke="#6C8EBF" stroke-width="2"/>
  <text x="280" y="480" font-family="Arial,sans-serif" font-size="9" fill="#6C8EBF">5. Present token</text>
  <text x="280" y="495" font-family="Arial,sans-serif" font-size="9" fill="#6C8EBF">to Deephaven</text>
  <text x="50" y="480" font-family="Arial,sans-serif" font-size="9" fill="#82B366">client-credentials /</text>
  <text x="50" y="495" font-family="Arial,sans-serif" font-size="9" fill="#82B366">password grant → Keycloak</text>

  <text x="40" y="1020" font-family="Arial,sans-serif" font-size="9" fill="#999">docs/oidc/keycloak-entra-broker-architecture  ·  2026-07-25</text>
</svg>
