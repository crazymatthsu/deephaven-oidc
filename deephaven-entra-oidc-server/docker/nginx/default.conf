# TLS front for the Deephaven web IDE — Entra ID requires HTTPS redirect URIs for any
# non-localhost host, so browsers reach Deephaven via https://<host>:1433 while nginx speaks
# plain HTTP to the server container.
#
# Certificates: mounted from ./certs (tls.crt/tls.key). scripts/start.sh entra generates a
# self-signed pair on first run (browser warning expected); replace with a corporate/ACME cert
# for real deployments. Register the HTTPS redirect URIs on the deephaven-users SPA platform:
#   https://<host>:1433/ide/
#   https://<host>:1433/iframe/widget/
#
# Scope note: this front carries the BROWSER traffic (static assets + Deephaven's websocket /
# grpc-web transports, all HTTP/1.1-upgradeable). Java gRPC clients don't need the HTTPS port —
# redirect URIs are a browser concern — and keep connecting to the backend directly (compose
# port 10000); on EKS the ALB's gRPC target group covers both.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 1433 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    location / {
        proxy_pass http://deephaven:10000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Deephaven's browser gRPC transport rides websockets; upgrade must pass through.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Streaming (grpc-web fetch streams, long-lived Barrage subscriptions): no buffering,
        # generous timeouts.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 100m;
    }
}
